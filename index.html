<style>
:root{
  --ink:#f7f3ff; --muted:#c3b9e2; --dim:#8f84b5;
  --glass:rgba(24,18,48,.78); --glass2:rgba(255,255,255,.06); --line:rgba(255,255,255,.13);
  --accent:#ff7a59; --radius:18px;
  --display:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:
  radial-gradient(60% 45% at 50% 108%, rgba(255,196,128,.85) 0%, rgba(255,140,110,.0) 70%),
  linear-gradient(180deg,#150f2e 0%,#2a1f57 30%,#6a3f8c 58%,#d86b7c 82%,#ffb27a 100%);}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}

/* ---------- labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;transition:opacity .8s}
body:not(.started) #labels{opacity:0}
.label{position:absolute;left:0;top:0;will-change:transform;transition:opacity .3s}
.label .inner{transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:999px;
  background:rgba(20,14,40,.72);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-weight:800;font-size:13px;letter-spacing:.01em;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.label .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--c)}
.label .inner::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.label.active .inner{background:var(--c);color:#1a1230;border-color:transparent}
.label.active .dot{background:rgba(255,255,255,.55)}
.bubble .inner{background:#fff;color:#21183d;font-weight:800}
.bubble .inner::after{background:#fff;border:0}
.label.hidden{opacity:0}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;transition:opacity .6s,transform .6s}
body:not(.started) .hud{opacity:0;pointer-events:none}
#brand{top:max(16px,env(safe-area-inset-top));left:18px;display:flex;align-items:center;gap:12px;padding:4px 16px 4px 4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#1b1433;
  background:conic-gradient(from 210deg,#ffd166,#ff7a59,#b388ff,#7bdff2,#ffd166);box-shadow:0 8px 24px rgba(255,122,89,.35)}
#brand .t1{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em}
#brand .t2{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
#nav{top:calc(max(16px,env(safe-area-inset-top)) + 64px);left:18px;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 7px;border-radius:12px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:700;font-size:13px;transition:transform .2s,background .2s;text-align:left}
.chip:hover{transform:translateX(4px);background:rgba(40,30,78,.9)}
.chip .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--c)}
.chip.on{outline:2px solid var(--c)}
#tools{top:max(16px,env(safe-area-inset-top));right:18px;display:flex;gap:8px;align-items:center}
.tbtn{height:38px;min-width:38px;padding:0 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(40,30,78,.92)}
#minimap{top:calc(max(16px,env(safe-area-inset-top)) + 50px);right:18px;width:168px;height:168px;border-radius:50%;background:rgba(20,14,40,.55);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:crosshair;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#hint{bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;color:var(--muted);white-space:nowrap}
#hint b{color:var(--ink)}
#hint.fade{opacity:0;transform:translateX(-50%) translateY(10px)}

/* ---------- panel ---------- */
#panel{position:fixed;z-index:6;right:20px;top:50%;width:min(410px,calc(100vw - 32px));max-height:calc(100vh - 130px);overflow:auto;
  transform:translate(calc(100% + 40px),-50%);transition:transform .45s cubic-bezier(.2,.9,.25,1.15);
  background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 30px 80px rgba(0,0,0,.45);user-select:text;-webkit-user-select:text;scrollbar-width:thin}
#panel.open{transform:translate(0,-50%)}
#panel .bar{height:5px;background:linear-gradient(90deg,var(--accent),transparent)}
.p-wrap{padding:20px 22px 22px}
.p-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.p-icon{width:58px;height:58px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,var(--accent),rgba(255,255,255,.15));box-shadow:0 10px 24px rgba(0,0,0,.3);overflow:hidden}
.p-icon img{width:100%;height:100%;object-fit:cover}
.p-kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.p-head h2{font-family:var(--display);font-size:19px;line-height:1.2;font-weight:700;margin-top:3px}
.p-x{margin-left:auto;align-self:flex-start;width:32px;height:32px;border-radius:10px;background:var(--glass2);font-size:16px;flex:none}
.p-x:hover{background:rgba(255,255,255,.14)}
.p-text{color:var(--muted);font-size:14.5px;line-height:1.6}
.p-text + .p-text{margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
.shots{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -22px 16px;padding:0 22px 8px;scroll-padding:0 22px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.shot{flex:none;height:230px;min-width:60px;border-radius:12px;overflow:hidden;scroll-snap-align:start;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 55%,#241a48),#1a1336);border:1px solid var(--line);cursor:zoom-in;padding:0;transition:transform .2s}
.shots:empty{display:none}
.shot:hover{transform:translateY(-2px)}
.shot img{height:100%;width:auto;display:block}
.shot.ph{width:130px;display:grid;place-items:center;font-size:11px;color:rgba(255,255,255,.6);cursor:default}
.p-icon img,.ri img,.dot img,.ic img,.logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.ri,.dot,.ic{overflow:hidden}
.logo{overflow:hidden}
.mini{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);font-weight:700;margin:10px 0 2px}
.mini b{color:var(--ink)}
.tl div i{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
/* lightbox */
#lb{position:fixed;inset:0;z-index:40;background:rgba(10,7,22,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:.25s}
#lb.open{opacity:1;visibility:visible}
#lb img{max-width:calc(100vw - 120px);max-height:calc(100vh - 80px);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lb button{position:absolute;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:20px;font-weight:800}
#lb button:hover{background:rgba(255,255,255,.2)}
#lb .lb-x{top:18px;right:18px}#lb .lb-p{left:18px;top:50%;margin-top:-23px}#lb .lb-n{right:18px;top:50%;margin-top:-23px}
#lb .lb-c{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--muted)}
@media (max-width:760px){#lb img{max-width:calc(100vw - 24px);max-height:calc(100vh - 140px)}#lb .lb-p,#lb .lb-n{top:auto;bottom:14px;margin:0}}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 16px;border-radius:14px;font-weight:800;font-size:14.5px;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:#1a1230;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.ghost{background:var(--glass2);border:1px solid var(--line);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:18px}
.stat span{font-size:11px;color:var(--muted);font-weight:700}
.sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:14px}
.row:hover{background:rgba(255,255,255,.1)}
.row .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:15px;flex:none}
.row small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:1px}
.row .go{margin-left:auto;color:var(--dim)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.tl div{position:relative;font-size:14px;color:var(--muted);line-height:1.5}
.tl div b{color:var(--ink);display:block}
.tl div::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#fff;color:#1b1433;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- joystick ---------- */
#joy{position:fixed;z-index:5;left:max(26px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;
  background:rgba(20,14,40,.45);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;touch-action:none}
#joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:linear-gradient(140deg,#fff,#d9d0ff);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.touch #joy{display:block}
body:not(.started) #joy{display:none}

/* ---------- loader ---------- */
#intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .9s,visibility .9s;
  background:radial-gradient(80% 60% at 50% 40%,rgba(42,31,87,.6),rgba(13,9,28,.92))}
#intro.gone{opacity:0;visibility:hidden}
#intro .big{width:86px;height:86px;border-radius:24px;margin:0 auto 22px;font-size:40px;animation:float 3s ease-in-out infinite}
#intro h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,56px);letter-spacing:.04em;line-height:1;
  background:linear-gradient(90deg,#ffd166,#ff7a59 40%,#b388ff 70%,#7bdff2);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro p{color:var(--muted);margin:14px 0 30px;font-weight:600}
#startBtn{padding:16px 30px;border-radius:999px;background:#fff;color:#1b1433;font-weight:800;font-size:16px;box-shadow:0 14px 40px rgba(255,255,255,.18);transition:transform .2s,opacity .3s}
#startBtn:hover{transform:scale(1.05)}
#startBtn:disabled{opacity:.5;cursor:wait}
#intro .alt{display:block;margin:16px auto 0;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
#intro .keys{margin-top:34px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;color:var(--dim);font-size:12px;font-weight:700}
kbd{display:inline-block;min-width:24px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-family:var(--body);font-size:11px;font-weight:800}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}

/* ---------- classic view ---------- */
#classic{position:fixed;inset:0;z-index:25;overflow:auto;background:linear-gradient(180deg,#140e2b,#22184a);transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.9,.25,1);user-select:text;-webkit-user-select:text}
#classic.open{transform:none}
.cl{max-width:900px;margin:0 auto;padding:28px 20px 70px}
.cl-top{display:flex;align-items:center;gap:14px;margin-bottom:40px}
.cl-top .tbtn{margin-left:auto}
.cl h1{font-family:var(--display);font-size:clamp(28px,5vw,46px);line-height:1.1}
.cl .lead{color:var(--muted);font-size:17px;line-height:1.6;margin:14px 0 26px;max-width:640px}
.cl h3{font-family:var(--display);font-size:18px;margin:44px 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card .p-icon{width:50px;height:50px;font-size:24px}
.card h4{font-family:var(--display);font-size:16px}
.card p{color:var(--muted);font-size:14px;line-height:1.55;flex:1}
.card .btn{padding:11px}
.cl-actions{display:flex;gap:10px;flex-wrap:wrap}
.cl-actions .btn{width:auto;padding:12px 20px;margin:0}

/* ---------- mobile ---------- */
@media (max-width:760px){
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:max(10px,env(safe-area-inset-bottom));max-height:60vh;transform:translateY(calc(100% + 30px))}
  #panel.open{transform:none}
  #nav{top:auto;bottom:max(16px,env(safe-area-inset-bottom));left:160px;right:12px;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:2px}
  #nav::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px}
  .chip .tx{display:none}
  .chip:hover{transform:none}
  #minimap{width:112px;height:112px}
  #brand .t2{display:none}
  #brand .t1{font-size:13px}
  .shot{height:180px}
  .tbtn .tx{display:none}
  #hint{bottom:auto;top:calc(max(16px,env(safe-area-inset-top)) + 54px);left:18px;transform:none;font-size:12px;white-space:normal;max-width:calc(100vw - 160px)}
  #hint.fade{transform:translateY(-10px)}
  body.panel-open #nav{opacity:0;pointer-events:none}
  body.panel-open #joy{opacity:.25}
}
@media (max-width:520px){ #brand .t1{display:none} #brand{padding:4px} #hint{top:calc(max(16px,env(safe-area-inset-top)) + 58px);max-width:calc(100vw - 150px)} }
@media (max-width:760px) and (orientation:landscape){
  #panel{left:auto;right:10px;width:min(380px,50vw);top:10px;bottom:10px;max-height:none;transform:translateX(calc(100% + 30px))}
  #panel.open{transform:none}
}
</style>

} }
</script>

<body>
<canvas id="scene" tabindex="0"></canvas>
<div id="labels"></div>

<!-- HUD -->
<div id="brand" class="hud">
  <div class="logo" id="brandLogo">Z</div>
  <div><div class="t1">ZENITRA GAMES</div><div class="t2" data-i="subtitle"></div></div>
</div>
<div id="nav" class="hud"></div>
<div id="tools" class="hud">
  <button class="tbtn" id="langBtn" title="Language">🌐 <span id="langTx">EN</span></button>
  <button class="tbtn" id="soundBtn" title="Sound">🔊</button>
  <button class="tbtn" id="classicBtn">📄 <span class="tx" data-i="classic"></span></button>
</div>
<canvas id="minimap" class="hud" width="336" height="336"></canvas>
<div id="hint" class="hud"></div>
<div id="joy"><div class="knob"></div></div>

<aside id="panel" aria-live="polite"><div class="bar"></div><div class="p-wrap" id="panelBody"></div></aside>
<div class="toast" id="toast"></div>
<div id="lb" aria-hidden="true"><img alt=""><button class="lb-x" aria-label="Close">✕</button><button class="lb-p" aria-label="Previous">‹</button><button class="lb-n" aria-label="Next">›</button><div class="lb-c"></div></div>

<!-- Intro -->
<div id="intro">
  <div>
    <div class="logo big">Z</div>
    <h1>ZENITRA GAMES</h1>
    <p data-i="introTag"></p>
    <button id="startBtn" disabled data-i="loading"></button>
    <button class="alt" id="introClassic" data-i="skip3d"></button>
    <div class="keys" id="introKeys"></div>
  </div>
</div>

<!-- Classic view -->
<div id="classic"><div class="cl" id="classicBody"></div></div>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

/* =====================================================================
   ✏️  CONFIG — Sitedeki bütün içerik burada. Sadece bu kısmı düzenlemen yeterli.
   ===================================================================== */
const PLAY_IMG = 'https://play-lh.googleusercontent.com/';
const CONFIG = {
  studio: 'Zenitra Games',
  person: 'Barış Bağatur',

if (new URLSearchParams(location.search).has('classic')) { setClassic(true); startGame(true); }
</script>
