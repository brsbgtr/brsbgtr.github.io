name: Update Play Store stats

on:
  schedule:
    - cron: '17 3 * * *'   # her gün 06:17 (Türkiye saati)
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save google-play-scraper@10.1.3
      - run: node scripts/update-stats.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "Update Play Store stats"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
